{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root {
            --accent: #2d6a9f;
            --accent-dark: #1a3c5e;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3c5e, #2d6a9f);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('{% static "assets/bg3.jpg" %}');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            padding: 32px 32px 24px;
            text-align: center;
            border: none;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 1.8rem;
            color: #fff;
        }

        .card-header h2 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 1.6rem;
            margin: 0;
        }

        .card-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            margin: 6px 0 0;
        }

        .card-body {
            background: #fff;
            padding: 32px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e0e7ef;
            padding: 10px 14px 10px 40px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45,106,159,0.1);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1rem;
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #aaa;
            font-size: 0.8rem;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .signup-link {
            text-align: center;
            font-size: 0.87rem;
            color: #666;
        }

        .signup-link a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .mb-form {
            margin-bottom: 18px;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="card-header">

            <div class="icon-circle">
                <i class="bi bi-person-circle"></i>
            </div>

            <h2>Student Login</h2>

            <p>Sign in to access your attendance records</p>

        </div>

        <div class="card-body">

            <form method="post" action="{% url 'studentlogin' %}">

                {% csrf_token %}

                <div class="mb-form">

                    <label class="form-label">Name</label>

                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                </div>

                <div class="mb-form">

                    <label class="form-label">Email</label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>

                <div class="mb-form">

                    <label class="form-label">Password</label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>

                <button type="submit" class="btn btn-primary mt-2">

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Login

                </button>

            </form>

            <div class="divider">or</div>

            <p class="signup-link">

                Don't have an account?

                <a href="{% url 'signup' %}">Sign Up</a>

            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
