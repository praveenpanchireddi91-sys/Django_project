{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            background:#f4f7fb;
            font-family:'Poppins',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-card{
            width:420px;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0 4px 25px rgba(0,0,0,0.08);
        }

        .login-title{
            text-align:center;
            margin-bottom:30px;
        }

        .login-title h2{
            font-weight:700;
            color:#0d6efd;
        }

        .login-title p{
            color:#777;
            font-size:14px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

        .btn-login{
            background:#0d6efd;
            color:white;
            border:none;
            height:50px;
            border-radius:12px;
            width:100%;
            font-weight:600;
            margin-top:10px;
        }

        .btn-login:hover{
            background:#0b5ed7;
        }

        .input-group-text{
            border-radius:12px 0 0 12px;
            background:white;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#0d6efd;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="login-title">

            <h2>

                <i class="bi bi-person-workspace"></i>

                Teacher Login

            </h2>

            <p>

                Login to manage attendance records

            </p>

        </div>

        <form method="POST" action="{% url 'teacherlogin' %}">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Email

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope-fill"></i>

                    </span>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>

            <button type="submit" class="btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

    </div>

</body>

</html>
