<!DOCTYPE html>
<!-- Include this snippet in your base template or other pages to display Django messages -->
<!-- Usage: {% include 'messages.html' %} -->

{% if messages %}
<div class="messages-container" style="position:fixed;top:16px;right:16px;z-index:9999;min-width:300px;max-width:400px;">
    {% for message in messages %}
    <div class="alert 
        {% if message.tags == 'error' %}alert-danger
        {% elif message.tags == 'success' %}alert-success
        {% elif message.tags == 'warning' %}alert-warning
        {% elif message.tags == 'info' %}alert-info
        {% else %}alert-secondary{% endif %}
        alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm mb-2"
        role="alert"
        style="border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;padding:14px 16px;">

        {% if message.tags == 'error' %}
            <i class="bi bi-x-circle-fill text-danger" style="font-size:1.1rem;flex-shrink:0"></i>
        {% elif message.tags == 'success' %}
            <i class="bi bi-check-circle-fill text-success" style="font-size:1.1rem;flex-shrink:0"></i>
        {% elif message.tags == 'warning' %}
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:1.1rem;flex-shrink:0"></i>
        {% else %}
            <i class="bi bi-info-circle-fill text-info" style="font-size:1.1rem;flex-shrink:0"></i>
        {% endif %}

        <span>{{ message }}</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Auto-dismiss alerts after 4 seconds
    document.querySelectorAll('.alert').forEach(alert => {
        setTimeout(() => {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }, 4000);
    });
</script>
{% endif %}
