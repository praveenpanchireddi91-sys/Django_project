{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #27ae60; --accent-dark: #1a6e3c; }
        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a6e3c, #27ae60);
            position: relative;
            padding: 24px 0;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('{% static "assets/bg1.jpg" %}');
            background-size: cover;
            background-position: center;
            opacity: 0.1;
        }
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            padding: 32px 32px 24px;
            text-align: center;
            border: none;
        }
        .card-header .icon-circle {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 1.8rem; color: #fff;
        }
        .card-header h2 { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.6rem; margin: 0; }
        .card-header p { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin: 6px 0 0; }
        .card-body { background: #fff; padding: 32px; }
        .form-label { font-size: 0.82rem; font-weight: 500; color: #555; margin-bottom: 6px; }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #e0e7ef;
            padding: 10px 14px 10px 40px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-select { padding-left: 14px; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(39,174,96,0.1); }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: #aaa; font-size: 1rem; pointer-events: none;
        }
        .btn-success {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-success:hover { opacity: 0.88; }
        .divider { display: flex; align-items: center; gap: 12px; color: #aaa; font-size: 0.8rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }
        .login-link { text-align: center; font-size: 0.87rem; color: #666; }
        .login-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .mb-form { margin-bottom: 16px; }
        .row-half .col { padding: 0 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon-circle"><i class="bi bi-person-plus"></i></div>
            <h2>Student Sign Up</h2>
            <p>Create your account to get started</p>
        </div>
        <div class="card-body">
            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="mb-form">
                    <label class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person"></i>
                        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="mb-form">
                    <label class="form-label">PIN Number</label>
                    <div class="input-wrapper">
                        <i class="bi bi-key"></i>
                        <input type="text" name="pin" class="form-control" placeholder="Enter your PIN" required>
                    </div>
                </div>
                <div class="mb-form">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope"></i>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="row row-half mb-form">
                    <div class="col">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>
                    </div>
                    <div class="col">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock-fill"></i>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm" required>
                        </div>
                    </div>
                </div>
                <div class="mb-form">
                    <label class="form-label">Academic Year</label>
                    <select name="year" class="form-select">
                        <option value="1">First Year</option>
                        <option value="2">Second Year</option>
                        <option value="3">Third Year</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success mt-2">
                    <i class="bi bi-check2-circle me-2"></i>Create Account
                </button>
            </form>
            <div class="divider">or</div>
            <p class="login-link">Already have an account? <a href="{% url 'student_login' %}">Log In</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
